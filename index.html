<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Are You Alone?</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      padding: 25px;
    }

    h1 {
      color: #e00000;
      font-size: 32px;
    }

    button {
      padding: 16px 28px;
      border: none;
      border-radius: 8px;
      background: #d00000;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    video {
      width: 100%;
      max-width: 700px;
      display: none;
    }

    #back {
      display: none;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1 id="title">ARE YOU ALONE?</h1>
    <p id="message">Make sure your volume is comfortable.</p>

    <button id="start" onclick="playVideo()">
      CLICK TO CONTINUE
    </button>

    <video id="scare" controls playsinline>
      <source src="jumpscare.mp4" type="video/mp4">
      Video tidak dapat dimainkan.
    </video>

    <br>

    <button id="back" onclick="location.reload()">
      KEMBALI
    </button>
  </div>

  <script>
    function playVideo() {
      const video = document.getElementById("scare");

      document.getElementById("title").style.display = "none";
      document.getElementById("message").style.display = "none";
      document.getElementById("start").style.display = "none";
      video.style.display = "block";
      document.getElementById("back").style.display = "inline-block";

      video.play().catch(() => {
        video.controls = true;
      });
    }
  </script>
</body>
</html>
